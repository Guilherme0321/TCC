[project]
name = "tcc-test-generation-pipeline"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
# benchmark/ contém os projetos-alvo do experimento (código de terceiros,
# pinado por commit); não é código deste repositório e não deve ser lintado.
extend-exclude = ["benchmark"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
